; PlatformIO Project Configuration File
;
; ESP32-S3 기반 웹 멀티플레이 격자 술래잡기 게임 - 1차 프로토타입
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-S3는 USB-CDC로 시리얼(USB) 출력을 하므로 아래 두 플래그가 반드시 필요하다.
; 이 설정이 없으면 시리얼 모니터에 아무 글자도 나오지 않을 수 있다.
; -I include 는 lib/GameServer 안의 코드에서도 include/ 폴더의 헤더
; (Config.h, GameTypes.h, WebSocketProtocol.h)를 찾을 수 있게 해준다.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I include

; PlatformIO 레지스트리에 등록된 정확한 라이브러리 이름을 사용한다.
; - ArduinoJson: JSON 직렬화/역직렬화 (버전 7 API 사용)
; - ESP32Async/AsyncTCP, ESP32Async/ESPAsyncWebServer:
;   me-no-dev가 관리하던 원본 저장소를 이어받아 현재 활발히 관리되는 공식 포크.
;   ESP32 Arduino 코어 3.x와 호환되며, 버전을 명시하지 않으면 항상 최신 버전을 받는다.
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer

; 웹페이지 파일(data 폴더)을 저장할 파일시스템으로 LittleFS를 사용한다.
board_build.filesystem = littlefs
; 아래 partitions.csv로 앱 영역과 LittleFS 영역 크기를 직접 나눈다.
board_build.partitions = partitions.csv
